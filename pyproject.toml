[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "purchase-eval"
version = "0.1.0"
description = "Multi-agent evaluation environment: a requester and an approver agent, a trusted authorization registry, and a trace-replaying verifier."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # the core and the deterministic mode are stdlib-only

[project.optional-dependencies]
llm = ["anthropic>=0.86"]
dev = ["pytest>=8"]

[project.scripts]
purchase-eval = "purchase_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -m 'not live'"
markers = ["live: calls the real Claude API (needs ANTHROPIC_API_KEY or .env); run with: pytest -m live"]
